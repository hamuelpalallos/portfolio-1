faq:
  title: Frequently Asked Questions
  description: Answers to common questions about my technical expertise and working style.
  categories:
    - title: Skills & Tech Stack
      questions:
        - label: What technologies do you work with?
          content: |
            I work primarily with modern web and mobile technologies. My core stack includes Vue.js and Nuxt.js for frontend, Flutter and Dart for cross-platform mobile apps, Laravel/PHP for backend APIs, and MySQL/MongoDB for databases. I also have experience with TypeScript, Tailwind CSS, Firebase, and cloud platforms like Azure. I'm always exploring new tools and frameworks to solve problems efficiently.
    - title: Experience & Projects
      questions:
        - label: What types of projects have you worked on?
          content: |
            I've worked on diverse projects ranging from real-time tabulation systems for events to inventory management platforms and mobile applications. My experience includes building dashboards for data visualization, creating full-stack web applications, developing mobile apps with Flutter, and implementing secure backend systems. I particularly enjoy projects that require solving complex problems with clean, scalable solutions.
    - title: AI, Self-Hosting & Tinkering
      questions:
        - label: What tools do you use day-to-day?
          content: |
            My daily toolkit includes VS Code for development, Git for version control, and Docker for containerization. I use various AI tools to enhance productivity while maintaining code quality. I'm also big on self-hosting and have experience setting up private infrastructure for development and production environments. I'm constantly tinkering with new technologies to stay current and find better ways to build software.
    - title: Working With Me
      questions:
        - label: What's your approach to collaboration?
          content: |
            I believe in transparent communication and collaborative problem-solving. I thrive in environments where technical excellence is valued and there's room for continuous learning. I'm comfortable working independently or as part of a team, and I always aim to write clean, maintainable code that others can understand and build upon. I'm proactive about sharing knowledge and helping teammates grow.