about:
  title: "About Me"
  description: |
    A Senior Software Engineer from the Philippines who's been building production software since 2018. I specialize in full-stack development with expertise in Vue.js, Nuxt.js, Flutter, and Laravel.
    My approach combines technical depth with practical problem-solving, creating robust applications that scale. I've worked on everything from real-time tabulation systems to cross-platform mobile apps.
