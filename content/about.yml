title: About Me
description: A Senior Software Engineer from the Philippines who's been building production software since 2018.
content: |
  Hi, I'm **Hamuel Palallos**, a Senior Software Engineer from the Philippines. For the past several years, I've been immersed in the world of software development, focusing on building robust full-stack solutions that scale. My journey has taken me from Laravel-based backend systems to modern Vue.js/Nuxt.js applications and cross-platform mobile development with Flutter.

  My path started with a deep curiosity about how software works and how it can solve real-world problems. Over the years, I've had the opportunity to work on diverse projects ranging from real-time tabulation systems for major events to comprehensive inventory management platforms and mobile applications that serve thousands of users.

  ### Where I've Worked

  I'm currently a Senior Software Engineer at **Tripket PH**, where I lead development efforts on dashboard systems, mobile applications, and backend infrastructure. Before that, I worked as a Software Developer at **Asbir Tech**, building enterprise applications and learning the fundamentals of scalable architecture.

  Throughout my career, I've had the privilege of working with startups and established companies alike, each experience teaching me valuable lessons about building software that matters. I've worked on everything from game development with Unity to complex inventory systems that track thousands of products in real-time.

  ### How I Work

  My approach to software development is rooted in pragmatism and continuous learning. I believe in choosing the right tools for the job while maintaining deep expertise in my core technologies. I enjoy tackling complex technical challenges and breaking them down into manageable, solvable components.

  I value clean code, thoughtful architecture, and systems that are built to last. But I also believe that the best software is software that actually gets used and solves real problems. I strive to balance technical excellence with practical business outcomes.

  ### My Tech Stack

  My primary technologies include **Vue.js** and **Nuxt.js** for frontend development, **Flutter** and **Dart** for cross-platform mobile apps, and **Laravel** for backend APIs. I work with **MySQL** and **MongoDB** for databases, and I have experience with cloud platforms like **Azure** and services like **Firebase**.

  I'm also passionate about modern development practices including CI/CD pipelines, containerization with Docker, and automated testing. I believe that good tooling and processes are essential for building and maintaining software at scale.

  ### AI & Intelligent Tooling

  I'm deeply interested in how AI tools can enhance development productivity without replacing the core problem-solving skills that make developers valuable. I use AI assistants to accelerate routine tasks while maintaining strong fundamentals and critical thinking.

  I believe that AI should augment human capabilities, not replace them. The best developers will be those who can effectively leverage AI tools while understanding the underlying technology deeply enough to make informed decisions and solve complex problems.

  ### Self-Hosted Infrastructure

  I'm a strong believer in self-hosting and maintaining control over the tools and infrastructure I use. I have experience setting up private infrastructure for development and production environments, including private Git repositories, CI/CD systems, and monitoring solutions.

  Self-hosting has taught me valuable lessons about system administration, security, and the importance of understanding the full stack from infrastructure to application code. It's an approach that I continue to advocate for in my work and personal projects.

  ### Always Exploring

  Technology is constantly evolving, and I'm always exploring new tools, frameworks, and approaches. Whether it's experimenting with new frontend frameworks, diving deeper into mobile development, or learning about emerging technologies, I believe that staying curious is essential for long-term growth.

  When I'm not coding, you might find me contributing to open-source projects, writing about software development, or sharing knowledge through talks and workshops. I believe in the importance of giving back to the community and helping others grow as developers.

  Thanks for stopping by. Feel free to browse my [projects](/projects), read my [blog posts](/blog), or [get in touch](mailto:hamuelpalallos@gmail.com) if you'd like to collaborate!
